
## Updated `docker-compose.yml`

Your Compose file should be adjusted because your current architecture uses **Ollama on the host**, while Qdrant runs in Docker.

```yaml
services:

  # ── Qdrant vector store ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: multimodal_qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Multimodal RAG application ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    container_name: multimodal_rag
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Qdrant is another Docker Compose service.
      QDRANT_URL: http://qdrant:6333

      # Ollama runs on the host machine.
      # host.docker.internal allows the container to reach the host.
      OLLAMA_HOST: http://host.docker.internal:11434

    volumes:
      # Optional local data directory.
      - ./data:/app/data

      # Persist raw table/image document storage.
      - doc_store:/app/doc_store

    depends_on:
      qdrant:
        condition: service_healthy

    command: ["python", "main.py", "--help"]

    ports:
      - "8000:8000"

volumes:
  qdrant_data:
  doc_store: